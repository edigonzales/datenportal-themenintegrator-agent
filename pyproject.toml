[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datenportal-themenintegrator-agent"
version = "0.1.0"
description = "Reproduzierbare Themenintegration mit menschlichen Freigaben für das Datenportal"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "mcp>=1.26,<2", "pydantic>=2.11,<3", "defusedxml>=0.7,<1", "openpyxl>=3.1,<4", "filelock>=3.18,<4", "jinja2>=3.1.6,<4"]

[project.scripts]
datenportal-integrator = "datenportal_integrator.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "respx>=0.22,<1", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/datenportal_integrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
