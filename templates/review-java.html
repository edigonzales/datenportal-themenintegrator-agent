<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>{{TITLE}}</title>
<style>
*{box-sizing:border-box}body{font:16px/1.6 system-ui,sans-serif;background:#eef3f5;color:#19313b;margin:0;padding:2rem 1rem}main{max-width:1160px;margin:auto;background:#fff;border:1px solid #d8e2e7;border-radius:14px;padding:2.5rem;min-width:0}h1{font-size:2rem;line-height:1.2;margin:0 0 2rem;color:#123f52}h2{font-size:1.35rem;line-height:1.3;margin:0 0 1rem}h3{font-size:1rem;margin:1rem 0 .5rem;overflow-wrap:anywhere}section{border-top:1px solid #d8e2e7;margin-top:2rem;padding-top:1.5rem;min-width:0}p{margin:.6rem 0}.eyebrow{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:#4d6672}.status{font-size:1.1rem;font-weight:650;padding:1rem;border-radius:6px}.success{background:#e8f4ee;color:#165637}.error{background:#fff0ee;color:#8c241c}.warning{background:#fff5dd;color:#714609}.neutral,.notice{background:#eef3f8;color:#29485b}.notice{padding:.8rem;border-left:3px solid #58758b}.messages{padding:.5rem 1rem;margin:.8rem 0;border-radius:6px}.fields{margin:.4rem 0}.fields>div{display:grid;grid-template-columns:minmax(120px,24%) minmax(0,1fr);gap:1rem;padding:.65rem 0;border-bottom:1px solid #e5ecef}.fields dt{font-weight:600;overflow-wrap:anywhere}.fields dd{margin:0;min-width:0}.text{white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#526875}ul{padding-left:1.4rem;margin:.3rem 0}li{margin:.3rem 0}.table-scroll{overflow:auto;max-width:100%;margin:.5rem 0}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{text-align:left;vertical-align:top;padding:.65rem;border:1px solid #d8e2e7;min-width:100px;max-width:340px;overflow-wrap:anywhere}th{background:#edf3f6;font-weight:650}td ul{padding-left:1rem}details{border:1px solid #d8e2e7;border-radius:6px;margin:.75rem 0;min-width:0}summary{cursor:pointer;padding:.8rem 1rem;font-weight:600;overflow-wrap:anywhere}summary:hover{background:#f0f5f7}.detail-body{padding:0 1rem 1rem;min-width:0}:focus-visible{outline:3px solid #236e91;outline-offset:2px}.file{border-left:3px solid #2e6e84;padding-left:1rem;margin:1.5rem 0}.code-block{border:1px solid #cedde4;border-radius:6px;overflow:hidden;margin:.6rem 0;max-width:100%}.code-label{font:600 .75rem/1.5 system-ui,sans-serif;background:#eaf1f5;color:#405966;padding:.4rem .8rem}pre{font:13px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre;tab-size:4;margin:0;padding:1rem;overflow:auto;max-width:100%;background:#f7fafc;color:#203744}code{font:inherit}.tok-keyword{color:#76428f;font-weight:600}.tok-string{color:#176249}.tok-comment{color:#5a6d78;font-style:italic}.tok-number{color:#94500a}.diff .added{background:#e0f3e6;color:#17522e}.diff .removed{background:#fce6e3;color:#882c25}.diff span{display:inline}.diff{border:1px solid #d8e2e7}footer{font-size:.85rem;color:#526875;border-top:1px solid #d8e2e7;margin-top:2rem;padding-top:1rem;overflow-wrap:anywhere}
@media(max-width:650px){body{padding:.5rem}main{padding:1rem;border-radius:8px}h1{font-size:1.6rem}.fields>div{grid-template-columns:minmax(0,1fr);gap:.2rem}.detail-body{padding:0 .6rem .6rem}summary{padding:.7rem}.file{padding-left:.6rem}pre{padding:.7rem}section{margin-top:1.5rem}}
@media print{body{background:#fff;padding:0;font-size:10pt}main{max-width:none;border:0;padding:0}h1{font-size:20pt}section{margin-top:1rem;padding-top:.8rem}details{break-inside:auto}details::details-content{display:block;content-visibility:visible}details>summary~*{display:block!important}summary{list-style:none;padding:.3rem 0}summary::marker{content:""}.detail-body{padding:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;overflow:visible;font-size:8pt}.table-scroll{overflow:visible}th,td{min-width:0;max-width:none;padding:.3rem}h2,h3,summary{break-after:avoid}.status,.messages,.code-block{print-color-adjust:exact}footer{font-size:8pt}}
</style>
</head>
<body><main><h1>{{TITLE}}</h1>{{CONTENT}}<footer>Diese Vorschau zeigt den gespeicherten Prüfstand. Freigaben beziehen sich auf dessen Prüfsumme. Beobachtungen und LLM-Vorschläge benötigen eine fachliche Prüfung.</footer></main></body>
</html>
