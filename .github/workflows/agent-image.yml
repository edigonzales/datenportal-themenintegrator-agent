name: Agent image
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  IMAGE: sogis/datenportal-themenintegrator-agent
  AGENT_VERSION: 0.1.${{ github.run_number }}
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Unit tests and formatting
        run: ./bin/datenportal-agent gradle test jar spotlessCheck
      - name: Build and smoke-test both platforms without workspace mounts
        run: |
          for arch in amd64 arm64; do
            docker buildx build --load --platform "linux/$arch" -f runtime/Dockerfile \
              --build-arg "AGENT_VERSION=$AGENT_VERSION" --build-arg "VCS_REF=$GITHUB_SHA" \
              -t "agent-test:$arch" .
            bash runtime/image-smoke.sh "agent-test:$arch" "linux/$arch"
          done
      - name: Installed-image network probe
        run: bash runtime/image-network-smoke.sh agent-test:amd64
      - name: Require publication credentials
        if: github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" && test -n "$DOCKERHUB_TOKEN" || {
            echo 'Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN with write access to sogis/datenportal-themenintegrator-agent.' >&2
            exit 1
          }
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish immutable version and verify registry artifact
        if: github.event_name == 'push'
        run: bash runtime/publish-image.sh version
  promote-latest:
    if: github.event_name == 'push'
    needs: verify-and-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only alias promotion is serialized. Version publications are never cancelled.
    concurrency:
      group: agent-image-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: bash runtime/publish-image.sh latest
