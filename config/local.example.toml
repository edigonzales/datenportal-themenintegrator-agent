# Relative paths resolve against root, itself relative to this configuration file.
root = ".."
topics_repo = "../datenportal-themenrepo"
stack_repo = "../datenportal-dev-stack"
state_dir = ".datenportal-integrator/runs"
# Use an installed, pinned distribution. The Java CLI setup-tools provisions it.
validator_command = ["java", "-jar", ".datenportal-integrator/tools/ilivalidator/ilivalidator-1.15.0.jar"]
# Originalmodelle kommen aus dem festgelegten Datenblatt-Image; zusätzliche Modelle optional.
model_dirs = []
compose_files = ["compose.yaml"]
stack_start_args = []
timeout_seconds = 300

# GRETL retains the existing Java-17 wrapper and Jenkins binary bundle.
# Set a real local JDK 17 path, or export GRADLE_JAVA_HOME_17.
# gretl_java_home = "/path/to/jdk-17"
gretl_offline_jars = ".datenportal-integrator/tools/gretl-runtime/jars"

[datasheet]
transport = "stdio"
image = "sogis/datenportal-datenblatt-mcp@sha256:b391421578f8c4652fb7a64465187746a3057ab4413d17cfc20a56025b470da1"
# Alternative: transport = "http", url = "http://127.0.0.1:8000/mcp"
# image bleibt als Quelle für Originalmodelle auch bei HTTP möglich.

[interlis]
transport = "stdio"
image = "sogis/interlis-mcp@sha256:b3ed1e738ccfe670f92ecebcbb014cf67aade5f0609e15be1f75948e15e899ff"
# Alternative: transport = "http", url = "http://localhost:8080/mcp"; image entfernen.

[environments.local]
kind = "local"
enabled = true
jenkins_url = "http://localhost:8081/jenkins"
portal_url = "http://localhost:8081"
manifest_url = "http://localhost:8081/ch.so.daten/current.json"
repository_mode = "working-tree"
username_env = "DATENPORTAL_LOCAL_USER"
token_env = "DATENPORTAL_LOCAL_TOKEN"
git_write_back = false
reload_portal = true

# INT/PROD are deliberately not preconfigured. Copy a profile, set the real
# URLs/branch and credential variable names, confirm managed-git/writeBack=false,
# then enable it. Credentials must never appear in this file or in Git.
