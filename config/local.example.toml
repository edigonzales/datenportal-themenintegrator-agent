# New Java-21 workspace. Paths are relative to root, itself relative to this file.
root = ".."
topics_repo = "../datenportal-themenrepo"
state_dir = ".datenportal-integrator/runs"
model_dirs = []
# Additional input directories, relative to root or absolute; e.g. ["../lieferungen"].
input_roots = []
timeout_seconds = 300
stack_timeout_seconds = 1800

# MCP programs and original INTERLIS models come from the installed package.
[datasheet]
transport = "stdio"
[interlis]
transport = "stdio"

# Configure publication profiles only when needed. No local stack is required
# for CSV/XTF validation or working against existing INT/PROD services.
# For optional local acceptance: set stack_repo at the top level and add
# an environments.local profile using loopback URLs and kind="local".
# INT/PROD: kind="int" or "prod", enabled=true, repository_mode="managed-git",
# jenkins_url, portal_url, manifest_url, username_env, token_env,
# git_remote="origin", git_branch="main", git_write_back=false, reload_portal=true.
# Secrets remain in environment variables or the credential store.
