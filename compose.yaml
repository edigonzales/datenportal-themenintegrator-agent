name: datenportal-integrator

services:
  datasheet:
    image: sogis/datenportal-datenblatt-mcp@sha256:b391421578f8c4652fb7a64465187746a3057ab4413d17cfc20a56025b470da1
    pull_policy: never
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: http
      DATASHEET_HOST: 0.0.0.0
      DATASHEET_PORT: 8000
    ports:
      - "127.0.0.1:8000:8000"
    labels:
      datenportal.integrator.root: ${PWD}

  interlis:
    image: sogis/interlis-mcp@sha256:72e834f04e74aed92658676ea3a693e0300f09ef91bb8f91c1334f8d943c94de
    pull_policy: never
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: http
    ports:
      - "127.0.0.1:8080:8080"
    labels:
      datenportal.integrator.root: ${PWD}

  gretl:
    image: sogis/datenportal-jenkins@sha256:c3eb068ed8636e546ca5b5cd2e57428ab31d1d00480446e52ad570bace46d833
    pull_policy: never
    restart: unless-stopped
    user: root
    entrypoint: ["bash", "/opt/integrator-runtime/gretl-entrypoint.sh"]
    environment:
      GRADLE_USER_HOME: /var/lib/integrator/gradle
      INTEGRATOR_RUNTIME_KEY: jenkins-0.1.0-6
    volumes:
      - gretl-data:/var/lib/integrator
      - ./runtime:/opt/integrator-runtime:ro
      - ../datenportal-themenrepo:/opt/integrator-topic:ro
    labels:
      datenportal.integrator.root: ${PWD}
    healthcheck:
      test: ["CMD", "test", "-f", "/var/lib/integrator/ready"]
      interval: 2s
      timeout: 2s
      retries: 150

volumes:
  gretl-data:
    name: datenportal-integrator-gradle-default
