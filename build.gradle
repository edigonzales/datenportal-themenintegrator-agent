plugins { id 'java'; id 'application'; id 'com.diffplug.spotless' version '8.7.0' }
group = 'ch.so.agi'
version = '0.2.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
repositories { mavenCentral(); maven { url = uri('https://jars.interlis.ch') } }
dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.5'
    implementation 'io.modelcontextprotocol.sdk:mcp:2.0.1'
    implementation 'org.tomlj:tomlj:1.1.1'
    implementation 'org.apache.commons:commons-csv:1.14.1'
    implementation 'org.apache.poi:poi-ooxml:5.4.1'
    implementation 'org.yaml:snakeyaml:2.4'
    implementation 'ch.interlis:ili2c-tool:5.6.8'
    implementation 'ch.interlis:ili2c-core:5.6.8'
    implementation 'org.junit.platform:junit-platform-console-standalone:1.13.4'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
application { mainClass = 'ch.so.agi.integrator.Main' }
sourceSets.main.resources { srcDir '.'; include 'compose.yaml', 'runtime/*.sh' }
test { useJUnitPlatform(); systemProperty 'integrator.root', projectDir.absolutePath }
tasks.register('integrationTest', Test) {
    dependsOn jar, testClasses
    useJUnitPlatform { includeTags 'integration' }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'integrator.root', projectDir.absolutePath
}
test { useJUnitPlatform { excludeTags 'integration' } }
tasks.withType(Test).configureEach {
    if (System.getenv('DATENPORTAL_TEST_TMP')) {
        systemProperty 'java.io.tmpdir', System.getenv('DATENPORTAL_TEST_TMP')
    }
}
jar {
    archiveFileName = 'datenportal-integrator.jar'
    manifest { attributes 'Main-Class': application.mainClass.get() }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class', 'META-INF/versions/**/module-info.class'
}
dependencyLocking { lockAllConfigurations() }
spotless { java { googleJavaFormat('1.28.0'); target 'src/main/java/**/*.java', 'src/test/java/**/*.java' } }
