plugins { id 'java'; id 'application'; id 'maven-publish'; id 'com.diffplug.spotless' version '8.7.0' }
group = 'ch.so.agi'
version = providers.gradleProperty('agentVersion').getOrElse('0.1.0-dev')
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral(); maven { url = uri('https://jars.interlis.ch') } }
dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.5'
    implementation 'io.modelcontextprotocol.sdk:mcp:2.0.1'
    implementation 'org.tomlj:tomlj:1.1.1'
    implementation 'org.apache.commons:commons-csv:1.14.1'
    implementation 'org.apache.poi:poi-ooxml:5.4.1'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.yaml:snakeyaml:2.4'
    implementation 'ch.interlis:ilivalidator:1.15.0'
    implementation 'ch.interlis:iox-ili:1.24.4'
    implementation 'ch.interlis:ili2c-tool:5.6.8'
    implementation 'ch.interlis:ili2c-core:5.6.8'
    implementation 'org.junit.platform:junit-platform-console-standalone:1.13.4'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
application { mainClass = 'ch.so.agi.integrator.Main' }
test { dependsOn jar; environment "GH_TOKEN", "SYNTHETIC_ISOLATED_TEST_TOKEN"; useJUnitPlatform(); systemProperty 'integrator.root', projectDir.absolutePath }
tasks.register('integrationTest', Test) {
    dependsOn jar, testClasses
    useJUnitPlatform { includeTags 'integration' }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'integrator.root', projectDir.absolutePath
}
test {
    useJUnitPlatform { excludeTags 'integration' }
    inputs.files(fileTree('bin'), fileTree('runtime') { include '*.sh' }, 'README.md', 'AGENTS.md', fileTree('.agents/skills'), fileTree('docs'), fileTree('templates'), fileTree('config') { exclude 'local.toml' }, fileTree('skills'))
}
tasks.register('operatorWorkspaceFiles', Sync) {
    into layout.buildDirectory.dir('operator-workspace')
    doFirst {
        def links = destinationDir.toPath().resolve('.agents')
        if (java.nio.file.Files.exists(links)) {
            try (def paths = java.nio.file.Files.walk(links)) {
                paths.sorted(java.util.Comparator.reverseOrder()).forEach { java.nio.file.Files.delete(it) }
            }
        }
    }
    from('skills') { into 'skills' }
    from('docs/agent') { into 'docs/agent' }
    from('templates/operator') {
        exclude 'anwenderhandbuch.md'
    }
    from('templates/operator/anwenderhandbuch.md') { into 'docs' }
    from('bin/datenportal-agent') { into 'bin'; filePermissions { unix('rwxr-xr-x') } }
    from('config') { include 'local.example.toml', 'settings.schema.json'; into 'config' }
    doLast {
        def root = destinationDir.toPath()
        def links = root.resolve('.agents/skills')
        java.nio.file.Files.createDirectories(links)
        file('skills').listFiles().findAll { it.isDirectory() }.each {
            def link = links.resolve(it.name)
            java.nio.file.Files.deleteIfExists(link)
            java.nio.file.Files.createSymbolicLink(link, java.nio.file.Path.of('../../skills/' + it.name))
        }
        java.nio.file.Files.writeString(root.resolve('workspace-package.json'), groovy.json.JsonOutput.toJson([version: project.version.toString()]))
        java.nio.file.Files.writeString(root.resolve('workspace-version'), project.version.toString() + '\n')
    }
}
tasks.register('operatorWorkspace', JavaExec) {
    dependsOn 'operatorWorkspaceFiles', 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ch.so.agi.integrator.WorkspaceArchive'
    args 'manifest', layout.buildDirectory.dir('operator-workspace').get().asFile.absolutePath
}
tasks.register('operatorWorkspaceArchive', JavaExec) {
    dependsOn 'operatorWorkspace'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ch.so.agi.integrator.WorkspaceArchive'
    args 'archive', layout.buildDirectory.dir('operator-workspace').get().asFile.absolutePath,
        layout.buildDirectory.file("distributions/datenportal-workspace-${project.version}.tar.gz").get().asFile.absolutePath
}
tasks.named('test') { dependsOn 'operatorWorkspace' }
// Only real integration tests need host-visible paths for sibling Docker bind mounts.
tasks.named('integrationTest', Test) {
    if (providers.gradleProperty('integrationConfig').isPresent()) {
        systemProperty 'integrator.test.config', providers.gradleProperty('integrationConfig').get()
    }
    if (System.getenv('DATENPORTAL_TEST_TMP')) {
        systemProperty 'java.io.tmpdir', System.getenv('DATENPORTAL_TEST_TMP')
    }
}
jar {
    archiveFileName = 'datenportal-integrator.jar'
    manifest { attributes 'Main-Class': application.mainClass.get(), 'Implementation-Version': project.version }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class', 'META-INF/versions/**/module-info.class'
}
dependencyLocking { lockAllConfigurations() }
spotless { java { googleJavaFormat('1.28.0'); target 'src/main/java/**/*.java', 'src/test/java/**/*.java' } }

// All released runtime artifacts target the same Java baseline.
tasks.withType(JavaCompile).configureEach { options.release = 21 }
configurations { datasheetExecutable; interlisExecutable }
repositories { maven { url = uri('https://jars.interlis.guru/snapshots/') } }
def localMcpArtifacts = providers.gradleProperty('mcpArtifactDirectory')
def datasheetVersion = providers.gradleProperty('datasheetVersion')
def interlisVersion = providers.gradleProperty('interlisVersion')
if (!localMcpArtifacts.isPresent()) {
    if (datasheetVersion.isPresent()) dependencies.add('datasheetExecutable', "ch.so.agi:datasheet-mcp:${datasheetVersion.get()}:boot@jar")
    if (interlisVersion.isPresent()) dependencies.add('interlisExecutable', "ch.so.agi:interlis-mcp:${interlisVersion.get()}:boot@jar")
}
// Executable server JARs have no transitive classpath; each is a self-contained process.
configurations.datasheetExecutable { transitive = false; resolutionStrategy.deactivateDependencyLocking() }
configurations.interlisExecutable { transitive = false; resolutionStrategy.deactivateDependencyLocking() }
tasks.register('validatorJar', Jar) {
    archiveFileName = 'ilivalidator.jar'
    destinationDirectory = layout.buildDirectory.dir('validator')
    manifest { attributes 'Main-Class': 'org.interlis2.validator.Main' }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class', 'META-INF/versions/**/module-info.class'
}
tasks.register('runtimeArtifacts', Sync) {
    dependsOn jar, 'validatorJar'
    into layout.buildDirectory.dir('runtime-artifacts')
    from(tasks.named('jar'))
    from(tasks.named('validatorJar'))
    if (localMcpArtifacts.isPresent()) {
        from(localMcpArtifacts) { include 'datasheet-mcp.jar', 'interlis-mcp.jar' }
    } else {
        from(configurations.datasheetExecutable) { rename { 'datasheet-mcp.jar' } }
        from(configurations.interlisExecutable) { rename { 'interlis-mcp.jar' } }
    }
    doFirst {
        if (!localMcpArtifacts.isPresent() && (!datasheetVersion.isPresent() || !interlisVersion.isPresent()))
            throw new GradleException('Set -PdatasheetVersion and -PinterlisVersion to published executable versions. Developer fixtures may use -PmcpArtifactDirectory.')
    }
    doLast {
        ['datasheet-mcp.jar', 'interlis-mcp.jar'].each {
            if (!new File(destinationDir, it).isFile()) throw new GradleException("Missing executable: $it")
        }
    }
}
tasks.register('distributionFiles', Sync) {
    dependsOn 'runtimeArtifacts', 'operatorWorkspace'
    into layout.buildDirectory.dir('java-distribution')
    from(tasks.named('runtimeArtifacts')) { into 'lib' }
    from(layout.buildDirectory.dir('operator-workspace')) { into 'workspace' }
    from('bin/datenportal-agent') { into 'bin'; filePermissions { unix('rwxr-xr-x') } }
    from('config') { include 'rules.json', 'local.example.toml', 'settings.schema.json'; into 'config' }
    from('validation') { into 'validation' }
    from('templates') { exclude 'operator/**'; into 'templates' }
    from('tests/fixtures') { into 'tests/fixtures' }
    from('LICENSE')
    doLast {
        def models = new File(destinationDir, 'models'); models.mkdirs()
        def server = new File(destinationDir, 'lib/datasheet-mcp.jar')
        copy {
            from(zipTree(server)) { include 'BOOT-INF/classes/models/*.ili'; eachFile { path = name }; includeEmptyDirs = false }
            into models
        }
        if (!new File(models, 'SO_AGI_DataCatalog_Datasheet_20260523.ili').isFile())
            throw new GradleException('Published Datenblatt JAR does not contain the original models')
        def inventory = new TreeMap<String, String>()
        fileTree(destinationDir).files.findAll { it.isFile() && it.name != 'distribution.json' }.sort().each {
            inventory[destinationDir.toPath().relativize(it.toPath()).toString()] = java.security.MessageDigest.getInstance('SHA-256').digest(it.bytes).encodeHex().toString()
        }
        new File(destinationDir, 'distribution.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            version: project.version.toString(), java: 21, developmentArtifacts: localMcpArtifacts.isPresent(),
            datasheetVersion: datasheetVersion.orNull, interlisVersion: interlisVersion.orNull, files: inventory
        ])) + '\n'
    }
}
tasks.register('javaDistribution', Tar) {
    dependsOn 'distributionFiles'
    archiveBaseName = 'datenportal-themenintegrator-agent'
    archiveClassifier = 'bin'
    compression = Compression.GZIP
    archiveExtension = 'tar.gz'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(layout.buildDirectory.dir('java-distribution'))
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
publishing {
    publications {
        operator(MavenPublication) {
            artifactId = 'datenportal-themenintegrator-agent'
            artifact(tasks.named('javaDistribution')) { classifier = 'bin'; extension = 'tar.gz' }
        }
    }
    repositories {
        maven {
            name = 'operatorSnapshots'; url = uri('https://jars.interlis.guru/snapshots/')
            authentication { basic(org.gradle.authentication.http.BasicAuthentication) }
            credentials {
                username = providers.environmentVariable('MAVEN_USERNAME').orNull
                password = providers.environmentVariable('MAVEN_PASSWORD').orNull
            }
        }
    }
}
tasks.withType(org.gradle.api.publish.maven.tasks.PublishToMavenRepository).configureEach {
    doFirst {
        if (localMcpArtifacts.isPresent()) throw new GradleException('Development MCP artifacts cannot be published in the operator distribution')
    }
}
