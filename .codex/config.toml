[mcp_servers.datenportal_integrator]
command = "bin/datenportal-agent"
args = ["--config","config/local.toml","serve"]
startup_timeout_sec = 180
tool_timeout_sec = 1800
env_vars = ["DATENPORTAL_LOCAL_USER","DATENPORTAL_LOCAL_TOKEN","DATENPORTAL_JENKINS_USER","DATENPORTAL_JENKINS_TOKEN"]

[mcp_servers.datenportal_integrator.env]
DATENPORTAL_FORWARD_ENV = "DATENPORTAL_LOCAL_USER DATENPORTAL_LOCAL_TOKEN DATENPORTAL_JENKINS_USER DATENPORTAL_JENKINS_TOKEN"
